# Unity's own template with one line added. The placeholders are not decoration:
# a template missing unityStreamingAssets or the heap argument fails the build in
# "Prepare For Build" with nothing but "Failed, 1 error(s)" to go on, which is how
# the first attempt at this file ended.
org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M
org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**

# The added line. extractNativeLibs is not a PlayerSetting in Unity 6000.6 — the old
# useLegacyPackaging API is gone — and the custom manifest cannot win it either, because
# Unity's generated launcher manifest sets it and takes priority in the merge. A built
# bundle was read back to establish that: it carried extractNativeLibs="true" while the
# manifest on disk asked for false. Uncompressed libraries are mapped from the APK in
# place instead of unpacked at install, so the install stops being double the download.
android.bundle.enableUncompressedNativeLibs=true

**ADDITIONAL_PROPERTIES**
